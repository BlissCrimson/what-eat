<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>what-eat</title>
</head>

<body>
    <header>
        <h1>what eat?</h1>
    </header>

    <section class="display display__dishes" data-view="suggestion">
        <p aria-placeholder="Klicke auf den Button für einen Vorschlag" data-el="suggestion-result">
            Klicke auf den Button für einen Vorschlag
        </p>
    </section>
    <button class="button button__dishes" data-action="suggest">
        <h2>Was sollst geben?</h2>
    </button>

    <section class="display display__list" data-view="list" hidden>
        <form data-el="add-form">
            <input class="input" type="text" placeholder="Gericht eingeben" data-el="dish-input" />
            <button class="button" type="submit">Hinzufügen</button>
        </form>
        <ul class="dish-list" data-el="dish-list"></ul>
    </section>

    <footer>
        <div>
            <span>&copy; 2025 Matthias Tausch</span>
            <a href="impressum.html"></a>
        </div>
        <button class="menu__button" data-action="toggle-view">
            Meine Liste
        </button>
    </footer>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
