<app-header></app-header>
<main class="main main__dishes">
  <button class="button button__dish button__dish--add" (click)="openAdd()">Gericht
    <img class="icon__dish--add" src="/asetts/icons/icon__plus.svg" alt="+">
  </button>
  <section class="dishes__list">
    <ul>
      @for (dish of dishService.dishes(); track $index) {
        <div class="dish__list">
          {{ dish.name }}
          <div class="dish__list--icons">
            <img class="icon__rename" src="/asetts/icons/icon__rename.png" alt="rename" (click)="openRename($index)">
            <img class="icon__trash" src="/asetts/icons/icon__trash.png" alt="trash" (click)="remove($index)">
          </div>
        </div>
      }
    </ul>
  </section>

  <dialog class="dialog__dishes" #addDialog (click)="closeOnBackdrop($event, addDialog)">
    <img class="dialog__dishes--icon" src="/asetts/icons/icon__plus.svg" alt="X" (click)="addDialog.close()">
    <label class="dialog__title" for="dishInput">Gericht</label>
    <input class="dialog__dishes--input" type="text" id="dishInput" placeholder="   z.B. Tortelini" [(ngModel)]="newName" (keydown.enter)="add()">
    <button class="button button__dish button__dish--add" (click)="add()">Hinzufügen</button>
  </dialog>
  <dialog class="dialog__dishes" #renameDialog (click)="closeOnBackdrop($event, renameDialog)">
    <img class="dialog__dishes--icon" src="/asetts/icons/icon__plus.svg" alt="X" (click)="renameDialog.close()">
    <label class="dialog__title--rename" for="renameInput">Gericht Umbenennen</label>
    <input class="dialog__dishes--input" type="text" id="renameInput" placeholder="   Neuer Name" [(ngModel)]="renameName" (keydown.enter)="confirmRename()">
    <button class="button button__dish button__dish--rename" (click)="confirmRename()">Umbenennen</button>
  </dialog>
</main>
<app-footer></app-footer>
