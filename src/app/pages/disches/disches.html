<app-header></app-header>
<main class="main main__dishes">
  <button class="button button__dish button__dish--add" id="openDialogBtn">Gericht
    <img class="icon__dish--add" src="./asetts/icons/icon__plus.svg" alt="+">
  </button>
  <section class="dishes__list">
    <ul id="meals">
    </ul>
  </section>

  <dialog class="dialog__dishes" id="addDishDialog">
    <img class="dialog__dishes--icon" id="closeDialogIcon" src="./asetts/icons/icon__plus.svg" alt="X">
    <label class="dialog__title" for="dishInput">Gericht</label>
    <input class="dialog__dishes--input" type="text" id="dishInput" placeholder="   z.B. Tortelini">
    <button class="button button__dish button__dish--add" id="addDishBtn">Hinzufügen</button>
  </dialog>
  <dialog class="dialog__dishes" id="renameDishDialog">
    <img class="dialog__dishes--icon" id="closeRenameDialogIcon" src="./asetts/icons/icon__plus.svg" alt="X">
    <label class="dialog__title--rename" for="renameInput">Gericht Umbenennen</label>
    <input class="dialog__dishes--input" type="text" id="renameInput" placeholder="   Neuer Name">
    <button class="button button__dish button__dish--rename" id="renameDishBtn">Umbenennen</button>
  </dialog>
</main>
<app-footer></app-footer>
