<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>what-eat</title>
    <link rel="shortcut icon" href="/what-eat/assets/favicon-BhUdmNPF.ico" type="image/x-icon">
    <link rel="manifest" href="/what-eat/assets/manifest-KLiGzPtH.json">
  <script type="module" crossorigin src="/what-eat/assets/main-CnmUeZCI.js"></script>
  <link rel="stylesheet" crossorigin href="/what-eat/assets/main-BZvJYOY9.css">
</head>

<body>
    <header>
        <h1>what eat?</h1>
    </header>

    <section class="display display__dishes">
        <p aria-placeholder="Klicke auf den Button für einen Vorschlag" data-el="suggestion-result">
            Klicke auf den Button für einen Vorschlag
        </p>
    </section>
    <button class="button button__dishes" data-action="suggest">
        <h2>Was sollst geben?</h2>
    </button>

    <footer>
        <div>
            <span>&copy; 2025 Matthias Tausch</span>
            <a href="pages/impresssum.html"></a>
        </div>
        <a class="menu__button" href="pages/dishes.html">
            Meine Liste
        </a>
    </footer>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registriert:', reg.scope))
                .catch(err => console.error('SW-Registrierung fehlgeschlagen:', err));
        }
    </script>
</body>

</html>
